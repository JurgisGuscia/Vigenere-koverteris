<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link type="text/css" rel="stylesheet" href="index.css">
    <title>Vigenere konverteris</title>
  </head>
  <body>
    <div class="dictDisplayWrapper">
        <span class="dictTitle">Žodynas: </span>
        <span id="dictList" class="dictList"></span>
    </div>
    <form id="form" class="inputForm">
        <div id="sliderContainer" class="formRow">
            <span>Išlėstinis: </span>
            <label class="toggle-switch">
                <input id="expanded" type="checkbox" />
                <span class="slider"></span>
            </label>
        </div>
        <div class="formRow">
            <label for="textInput">Tekstas: </label>
            <input type="text" id="textInput" name="text" class="inputField"/>
        </div>

        <div class="formRow">
            <label for="keyInput">Raktas: </label>
            <input type="text" id="keyInput" name="key" class="inputField"/>
        </div>

        <div id="buttonWrapper" class="formRow">
            <button type="button" id="scrambleBtn" class="button">Užkoduoti</button>
            <button type="button" id="decodeBtn" class="button">Atkoduoti</button>
        </div>
        <div class="outputRow ">
            <div id="output"></div>
        </div>
    </form>
    <script src="inputCheck.js"></script>
    <script src="converter.js"></script>
    <script src="main.js"></script>
  </body>
</html>
